; GTAxBeam settings, read when GTA starts. Lives next to GTAxBeam.asi in the GTA V folder.

[beamng]
; BeamNG vehicle model (a folder name under BeamNG.drive\content\vehicles, without .zip) and optional config path,
; e.g. config=vehicles/etk800/854t_A.pc
model=etk800
config=

[gta]
; GTA vehicle that stands in for the BeamNG car (collision for GTA's traffic, the seat, the camera target)
proxy=tailgater
; 1 shows the stand-in car whenever the compositor isn't drawing BeamNG's own car (no ReShade, BeamNG's picture not
; arriving); 0 never shows it (an orange box marks the car instead)
proxyVisible=1
